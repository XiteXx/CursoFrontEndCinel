<div class="login-card">
    <h2>SignIn</h2>
    <p>Sigin Forms</p>

    <button class="clean-button" (click)="this.signInForms.reset()">Reset Formulario</button>

    <form [formGroup]="this.signInForms" (ngSubmit)="onSubmit()">
        
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="Introduza o seu email" formControlName="email" />

        <label for="password">Palavra-passe</label>
        <input id="password" type="password" placeholder="Introduza a sua palavra-passe" formControlName="password" />

        <div class="button-group">
            <button type="button" class="go-back" (click)="goBack()">Retroceder</button>
            <!-- o Type submit faz com que a tag form execute o formulario,e faz com que o ngsubmit receba o nosso form -->
            <button class="sign-in" type="submit">Login</button>
        </div>
        
    </form>
</div>
